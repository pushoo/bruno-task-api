name: API tests (Bruno)

on:
  push:
  pull_request:

jobs:
  bruno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Start the Task API
        run: |
          npm start &
          npx --yes wait-on http://localhost:3000/health

      - name: Run Bruno collection
        working-directory: bruno
        run: npx bru run --env Local --exclude-tags app-only --reporter-junit results.xml --reporter-html report.html

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bruno-reports
          path: |
            bruno/results.xml
            bruno/report.html
